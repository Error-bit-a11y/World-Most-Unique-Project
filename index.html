<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .bulb {
        border: 2px solid black;
        height: 50px;
        width: 50px;
        background-color: gray;
        border-radius: 100px;
        margin: 50px;

    }

    .glow {
        background-color: rgb(1, 16, 131);
        box-shadow: 0 0 30px rgb(24, 35, 238), 0 0 60px rgb(31, 48, 236);
    }
</style>

<body>
    <div class="bulb"></div>
    <button id="btn">ON/OFF</butoon>

        <script>
            let bulb = document.querySelector(".bulb");
            let button = document.querySelector("#btn");

            button.addEventListener("click", () => {
                bulb.classList.toggle("glow");
            });

        </script>
</body>

</html>
